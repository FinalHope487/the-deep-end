# Publish the single-file build (dist/index.html + dist/audio/) to GitHub Pages on every push to main.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build.mjs
      # archived build from before the flooded-column room (abccf01^), opened with ?v=pre-column
      - uses: actions/checkout@v4
        with:
          ref: b2683e67f5d04c7aee4cadab6b395c0e58bb3692
          path: legacy-src
      - run: node legacy-src/tools/build.mjs --out dist/legacy/pre-column
      # v1 before broken terrain (a7ad18b) minus the colonnade room, plus ported non-terrain fixes, opened with ?v=no-colonnade
      - uses: actions/checkout@v4
        with:
          ref: a7ad18b8bccbd709afcd2628503cb86ef1dd918e
          path: nocol-src
      - run: git -C nocol-src apply --whitespace=nowarn "$GITHUB_WORKSPACE/tools/legacy/no-colonnade.patch"
      - run: node nocol-src/tools/build.mjs --out dist/legacy/no-colonnade
      # archived phase artifacts (?gen=v3&phase=pN) are published next to the default game
      - run: if [ -d versions ]; then mkdir -p dist/versions && cp -R versions/. dist/versions/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
