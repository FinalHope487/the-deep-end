# Publish the single-file build (dist/index.html + dist/audio/) to GitHub Pages on every push to main.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build.mjs
      # archived build from before the flooded-column room (abccf01^), opened with ?v=pre-column
      - uses: actions/checkout@v4
        with:
          ref: b2683e6
          path: legacy-src
      - run: node legacy-src/tools/build.mjs --out dist/legacy/pre-column
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
