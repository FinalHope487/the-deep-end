  }
  return items;
}

// Sorted unique string set.
function sortedUniqueStrings(itemFn = str) {
  return (value, path) => {
    const items = list(value, path, itemFn);
    uniqueIds(items, path);
    return checkOrdered(items, path);
  };
}

// Adapts a Result-returning validator to a throwing checker with a nested path.
const nested = (validator) => (value, path) => {
  if (!isPlain(value)) throw new Fail('BAD_TYPE', path);
  const result = validator(value);
  if (!result.ok) throw new Fail(result.code, path + (result.path === '/' ? '' : result.path));
  return result.value;
};

function deepFreeze(value) {
  if (value !== null && typeof value === 'object' && !Object.isFrozen(value)) {
    Object.freeze(value);
    for (const key of Object.keys(value)) deepFreeze(value[key]);
  }
  return value;
}

// ---- v3/core/module.js ----
// ModuleDescriptor: pure JSON identity and feature specs of one module slot.
// Lives in its own file so world.js can validate registries without importing
// the contracts.js entry point (which re-exports world.js).


// The parts of a registry entry `{descriptor, generate}`, read as own data: a missing or malformed entry is a
// failed Result with its path, never a TypeError, and no getter runs. The caller checks `generate`.
function readModuleEntry(entry, path) {
  if (!isPlain(entry)) throw new Fail('BAD_TYPE', path);
  if (!Object.hasOwn(entry, 'descriptor')) throw new Fail('MISSING_FIELD', `${path}/descriptor`);
  const descriptor = readOwn(entry, 'descriptor', path);
  if (!isPlain(descriptor)) throw new Fail('BAD_TYPE', `${path}/descriptor`);
  return { descriptor, generate: readOwn(entry, 'generate', path) };
}

function validateModuleDescriptor(value, options = {}) {
  requireObject(value, 'validateModuleDescriptor');
  return run(() => record(value, '', {
    formatVersion: version, moduleId: str, moduleVersion: (v, p) => int(v, p, 1),
    kind: (v, p) => oneOf(v, p, ['region', 'landmark']), slotId: localKey,
    featureSpecs: listOf((v, p) => record(v, p, {
      type: str, params: jsonObject, anchor: vec3, ownerId: str })),
  }, { ext: extChecker(options) }));
}

// ---- v3/core/space.js ----
// Space: the canonical geometry fact of one owner (region, landmark or filler).
// Shapes and feature types are pluggable adapters ({validate(p, path) -> p});
// adding a shape kind adds one adapter, never an edit to the validator.


const positiveRange = (lo, hi, path) => {
  if (!(hi > lo)) throw new Fail('BAD_RANGE', path);
};

// An adapter may add faceElevation(p, face) -> local y of the 'top' or 'bottom'
// face. It returns undefined when the face has no single elevation (arch).
const boxAdapter = {
  validate(p, path) {
    const out = record(p, path, { min: vec3, max: vec3 });
    for (const axis of ['x', 'y', 'z']) positiveRange(out.min[axis], out.max[axis], path);
    return out;
  },
  faceElevation: (p, face) => (face === 'top' ? p.max.y : p.min.y),
};

const pointXZ = (value, path) => record(value, path, { x: num, z: num });

// Simple counter-clockwise polygon in (x, z): positive signed area, no
// zero-length edge, no spike, no crossing or touching of non-adjacent edges.
function checkSimpleCcw(base, path) {
  const n = base.length;
  const fail = () => { throw new Fail('BAD_RANGE', `${path}/base`); };
  const cross = (o, a, b) => (a.x - o.x) * (b.z - o.z) - (a.z - o.z) * (b.x - o.x);
  let area2 = 0;
  for (let i = 0; i < n; i++) {
    const a = base[i], b = base[(i + 1) % n];
    if (a.x === b.x && a.z === b.z) fail();
    area2 += a.x * b.z - b.x * a.z;
  }
  if (!(area2 > 0)) fail();
  const onSegment = (a, b, c) => Math.min(a.x, b.x) <= c.x && c.x <= Math.max(a.x, b.x)
    && Math.min(a.z, b.z) <= c.z && c.z <= Math.max(a.z, b.z);
  const touches = (a, b, c, d) => {
    const d1 = cross(a, b, c), d2 = cross(a, b, d), d3 = cross(c, d, a), d4 = cross(c, d, b);
    if (((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) && ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0))) return true;
    return (d1 === 0 && onSegment(a, b, c)) || (d2 === 0 && onSegment(a, b, d))
      || (d3 === 0 && onSegment(c, d, a)) || (d4 === 0 && onSegment(c, d, b));
  };
  for (let i = 0; i < n; i++) {
    const a = base[i], b = base[(i + 1) % n], c = base[(i + 2) % n];
    const dot = (b.x - a.x) * (c.x - b.x) + (b.z - a.z) * (c.z - b.z);
    if (cross(a, b, c) === 0 && dot < 0) fail();
    for (let j = i + 2; j < n; j++) {
      if (i === 0 && j === n - 1) continue;
      if (touches(a, b, base[j], base[(j + 1) % n])) fail();
    }
  }
}

const prismAdapter = {
  validate(p, path) {
    const out = record(p, path, { base: listOf(pointXZ), y0: num, y1: num });
    if (out.base.length < 3) throw new Fail('BAD_RANGE', `${path}/base`);
    checkSimpleCcw(out.base, path);
    positiveRange(out.y0, out.y1, path);
    return out;
  },
  faceElevation: (p, face) => (face === 'top' ? p.y1 : p.y0),
};

const cylinderAdapter = {
  validate(p, path) {
    const out = record(p, path, { cx: num, cz: num, radius: num, y0: num, y1: num });
    if (!(out.radius > 0)) throw new Fail('BAD_RANGE', `${path}/radius`);
    positiveRange(out.y0, out.y1, path);
    return out;
  },
  faceElevation: (p, face) => (face === 'top' ? p.y1 : p.y0),
};

const archAdapter = {
  validate(p, path) {
    const out = record(p, path, {
      plane: (v, pt) => oneOf(v, pt, ['xy', 'zy']), center: vec3,
      width: num, springY: num, rise: num, depth: num,
    });
    if (!(out.width > 0)) throw new Fail('BAD_RANGE', `${path}/width`);
    if (!(out.rise > 0)) throw new Fail('BAD_RANGE', `${path}/rise`);
    if (!(out.depth > 0)) throw new Fail('BAD_RANGE', `${path}/depth`);
    if (!(out.springY >= 0)) throw new Fail('BAD_RANGE', `${path}/springY`);
    return out;
  },
};

const DEFAULT_SHAPE_ADAPTERS = Object.freeze({
  box: boxAdapter, prism: prismAdapter, cylinder: cylinderAdapter, arch: archAdapter,
});

const DEFAULT_FEATURE_ADAPTERS = Object.freeze({
  generic: { validate: (params, path) => jsonObject(params, path) },
});

// Strict mode rejects a shape kind with no adapter; transport mode keeps its
// well-formed JSON untouched (it cannot be drawn or collided).
function shapeChecker(adapters, strict) {
  return (value, path) => {
    const head = record(value, path, { kind: pattern(/^[a-z][a-z0-9-]*$/), v: (x, p) => int(x, p, 1), p: (x) => x });
    // an adapter validates the versions it lists (default: version 1 only)
    const adapter = Object.hasOwn(adapters, head.kind) ? adapters[head.kind] : null;
    if (!adapter || !(adapter.versions ?? [1]).includes(head.v)) {
      if (strict) throw new Fail('UNKNOWN_SHAPE', path);
      return { kind: head.kind, v: head.v, p: jsonObject(head.p, `${path}/p`) };
    }
    const p = jsonObject(head.p, `${path}/p`); // adapters see a safe copy and their result must be JSON again
    return { kind: head.kind, v: head.v, p: jsonObject(adapter.validate(p, `${path}/p`), `${path}/p`) };
  };
}

function shapeValidator(options = {}) {
  return shapeChecker(options.shapeAdapters ?? DEFAULT_SHAPE_ADAPTERS,
    (options.mode ?? 'strict') === 'strict');
}

// Reference to a support surface of a volume. `adapter` faces are resolved by
// the volume's shape adapter and need a surfaceKey; top and bottom must not.
function supportRefShape(value, path) {
  const out = record(value, path, {
    volumeId: localKey, face: (v, p) => oneOf(v, p, ['top', 'bottom', 'adapter']),
  }, { surfaceKey: str });
  if ((out.face === 'adapter') !== Object.hasOwn(out, 'surfaceKey')) {
    throw new Fail(out.face === 'adapter' ? 'MISSING_FIELD' : 'UNKNOWN_FIELD', `${path}/surfaceKey`);
  }
  return out;
}

function featureChecker(shapeFn, featureAdapters, strict) {
  const surfaceRef = supportRefShape;
  return (value, path) => {
    const out = record(value, path, {
      featureId: localKey, type: str, ownerId: str, anchor: vec3,
      shape: nullable(shapeFn), params: (x) => x,
      waterBodyId: nullable(localKey), surfaceRefs: listOf(surfaceRef),
    });
    if (Object.hasOwn(featureAdapters, out.type)) {
      const params = jsonObject(out.params, `${path}/params`);
      out.params = jsonObject(featureAdapters[out.type].validate(params, `${path}/params`), `${path}/params`);
    } else if (strict) {
      throw new Fail('UNKNOWN_FEATURE', `${path}/type`);
    } else {
      out.params = jsonObject(out.params, `${path}/params`);
    }
    return out;
  };
}

const OWNER_KIND_ID = { region: 'r', landmark: 'l', filler: 'f' };

// Shared water bodies must agree on level and anchor Space across Spaces (rev4:24). `entries` is a list of
// {space, path}; `path` locates the Space in error reports.
function checkWater(entries) {
  const groups = new Map();
  for (const { space, path } of entries) {
    space.features.forEach((feature, j) => {
      if (feature.waterBodyId === null) return;
      if (!groups.has(feature.waterBodyId)) groups.set(feature.waterBodyId, []);
      groups.get(feature.waterBodyId).push({ feature, path: `${path}/features/${j}/params` });
    });
  }
  for (const members of groups.values()) {
    const first = members[0].feature.params;
    for (const { feature, path } of members) {
      if (feature.params.levelY !== first.levelY) throw new Fail('BAD_WATER_LEVEL', `${path}/levelY`);
    }
    for (const { feature, path } of members) {
      if (feature.params.anchorSpaceId !== first.anchorSpaceId) throw new Fail('BAD_WATER_ANCHOR', `${path}/anchorSpaceId`);
    }
  }
}

function validateSpace(value, options = {}) {
  requireObject(value, 'validateSpace');
  const shapeFn = shapeValidator(options);
  const featureFn = featureChecker(shapeFn, options.featureAdapters ?? DEFAULT_FEATURE_ADAPTERS,
    (options.mode ?? 'strict') === 'strict');
  return run(() => {
    const out = record(value, '', {
      formatVersion: version, spaceId: objectId('s'), worldId: objectId('w'),
      ownerKind: (v, p) => oneOf(v, p, Object.keys(OWNER_KIND_ID)), ownerId: str,
      frame: (v, p) => record(v, p, { origin: vec3 }), bounds,
      levels: listOf((v, p) => record(v, p, { levelId: localKey, datumY: num })),
      volumes: listOf((v, p) => record(v, p, {
        volumeId: localKey, kind: (k, pt) => oneOf(k, pt, ['solid', 'open', 'void', 'scenic']),
        levelId: localKey, shape: shapeFn })),
      portals: listOf((v, p) => record(v, p, {
        portalId: localKey, fromVolumeId: localKey, toVolumeId: nullable(localKey), shape: shapeFn,
        purpose: (k, pt) => oneOf(k, pt, ['pass', 'view', 'blind', 'niche']) })),
      features: listOf(featureFn),
      access: (v, p) => oneOf(v, p, ['traversable', 'scenic']),
    }, { ext: extChecker(options) });
    objectId(OWNER_KIND_ID[out.ownerKind])(out.ownerId, '/ownerId');
    sameWorld(out.spaceId, out.worldId, '/spaceId');
    sameWorld(out.ownerId, out.worldId, '/ownerId');
    // arrays are sorted by stable id so equal Spaces serialize equally (rev3:76)
    for (const [items, path, key] of [
      [out.levels, '/levels', (l) => l.levelId], [out.volumes, '/volumes', (v) => v.volumeId],
      [out.portals, '/portals', (p) => p.portalId], [out.features, '/features', (f) => f.featureId]]) {
      uniqueIds(items, path, key);
      checkOrdered(items, path, key);
    }
    const levels = new Set(out.levels.map((l) => l.levelId));
    const volumes = new Set(out.volumes.map((v) => v.volumeId));
    out.volumes.forEach((v, i) => {
      if (!levels.has(v.levelId)) throw new Fail('BAD_REF', `/volumes/${i}/levelId`);
    });
    out.portals.forEach((p, i) => {
      if (!volumes.has(p.fromVolumeId)) throw new Fail('BAD_REF', `/portals/${i}/fromVolumeId`);
      if (p.toVolumeId !== null && !volumes.has(p.toVolumeId)) {
        throw new Fail('BAD_REF', `/portals/${i}/toVolumeId`);
      }
    });
    out.features.forEach((f, i) => {
      f.surfaceRefs.forEach((ref, j) => {
        if (!volumes.has(ref.volumeId)) {
          throw new Fail('BAD_REF', `/features/${i}/surfaceRefs/${j}/volumeId`);
        }
      });
      if (f.waterBodyId !== null) checkWaterParams(f, `/features/${i}/params`, out.worldId);
    });
    return out;
  });
}

// A water feature carries params {levelY, anchorSpaceId}; the anchor must be a
// Space id of this world (rev4 s4). Sharing rules across Spaces: see snapshot.js.
function checkWaterParams(feature, path, worldId) {
  const { params } = feature;
  if (!Object.hasOwn(params, 'levelY')) throw new Fail('MISSING_FIELD', `${path}/levelY`);
  num(params.levelY, `${path}/levelY`);
  if (!Object.hasOwn(params, 'anchorSpaceId')) throw new Fail('MISSING_FIELD', `${path}/anchorSpaceId`);
  objectId('s')(params.anchorSpaceId, `${path}/anchorSpaceId`);
  sameWorld(params.anchorSpaceId, worldId, `${path}/anchorSpaceId`);
}

// ---- v3/core/traversal.js ----
// Traversal: how to move through one Space. Surfaces refer to Space volumes
// (the Space owns the geometry); links may point into another Space and are
// resolved later by validateResolved.



const endpoint = (v, p) => record(v, p, { spaceId: objectId('s'), nodeId: localKey });

// Walkable support is solid.top or open.bottom (adapter faces are resolved by
// the volume's shape adapter and are not checked here).
const SUPPORT_VOLUME_KIND = { top: 'solid', bottom: 'open' };

// `space` must already be a validated Space (validateSpace): its volumes are read without re-checking.
function validateTraversal(value, space, options = {}) {
  requireObject(value, 'validateTraversal');
  requireObject(space, 'validateTraversal(space)');
  return run(() => {
    const out = record(value, '', {
      formatVersion: version, spaceId: objectId('s'),
      nodes: listOf((v, p) => record(v, p, {
        nodeId: localKey, volumeId: localKey, levelId: localKey, surfaceId: localKey })),
      surfaces: listOf((v, p) => record(v, p, {
        surfaceId: localKey, kind: (k, pt) => oneOf(k, pt, ['walkable', 'scenic', 'blocked']),
        supportRef: supportRefShape })),
      links: listOf((v, p) => record(v, p, {
        linkId: localKey, from: endpoint, to: endpoint,
        kind: (k, pt) => oneOf(k, pt, ['walk', 'step', 'ladder', 'transition']),
        direction: (d, pt) => oneOf(d, pt, ['both', 'forward']) })),
      blockedVolumeIds: sortedUniqueStrings(localKey),
    }, { ext: extChecker(options) });
    if (out.spaceId !== space.spaceId) throw new Fail('BAD_REF', '/spaceId');
    const volumeKinds = new Map(space.volumes.map((v) => [v.volumeId, v.kind]));
    const levels = new Set(space.levels.map((l) => l.levelId));
    for (const [items, path, key] of [
      [out.nodes, '/nodes', (n) => n.nodeId], [out.surfaces, '/surfaces', (s) => s.surfaceId],
      [out.links, '/links', (l) => l.linkId]]) {
      uniqueIds(items, path, key);
      checkOrdered(items, path, key);
    }
    const surfaceVolume = new Map(out.surfaces.map((s) => [s.surfaceId, s.supportRef.volumeId]));
    const nodes = new Set(out.nodes.map((n) => n.nodeId));
    out.surfaces.forEach((s, i) => {
      const ref = s.supportRef;
      const base = `/surfaces/${i}/supportRef`;
      if (!volumeKinds.has(ref.volumeId)) throw new Fail('BAD_REF', `${base}/volumeId`);
      const need = SUPPORT_VOLUME_KIND[ref.face];
      if (need && volumeKinds.get(ref.volumeId) !== need) throw new Fail('BAD_FIELD', `${base}/face`);
    });
    out.nodes.forEach((n, i) => {
      if (!volumeKinds.has(n.volumeId)) throw new Fail('BAD_REF', `/nodes/${i}/volumeId`);
      if (!levels.has(n.levelId)) throw new Fail('BAD_REF', `/nodes/${i}/levelId`);
      // rev6:36: the node's surface is supported by the node's own volume
      if (surfaceVolume.get(n.surfaceId) !== n.volumeId) throw new Fail('BAD_REF', `/nodes/${i}/surfaceId`);
    });
    out.blockedVolumeIds.forEach((id, i) => {
      if (!volumeKinds.has(id)) throw new Fail('BAD_REF', `/blockedVolumeIds/${i}`);
    });
    out.links.forEach((link, i) => {
      const base = `/links/${i}`;
      // A forward link is owned by its from-Space; a both link by the Space
      // whose spaceId sorts first (UTF-16 order), a function of the pair only.
      const owner = link.direction === 'forward' ? link.from.spaceId
        : (link.from.spaceId <= link.to.spaceId ? link.from.spaceId : link.to.spaceId);
      if (owner !== out.spaceId) throw new Fail('BAD_REF', `${base}/direction`);
      for (const end of ['from', 'to']) {
        // an endpoint may sit in a Space that is not loaded, but never in another world (rev4 section 3)
        sameWorld(link[end].spaceId, space.worldId, `${base}/${end}/spaceId`);
        // A target in another Space is resolved later (validateResolved).
        if (link[end].spaceId === out.spaceId && !nodes.has(link[end].nodeId)) {
          throw new Fail('BAD_REF', `${base}/${end}/nodeId`);
        }
      }
    });
    return out;
  });
}

// A walk link joins two walking surfaces, so their world elevations must agree.
// step, ladder and transition links may change elevation.
const WALK_ELEVATION_TOLERANCE = 1e-6;

// World y of the support face behind a node, or null when it cannot be known
// (unknown shape kind, adapter face, or an adapter without faceElevation);
// validateResolved reports null on a walk link as UNKNOWN_SURFACE.
function nodeElevation(entry, nodeId, shapeAdapters) {
  const node = entry.traversal.nodes.find((n) => n.nodeId === nodeId);
  const surface = entry.traversal.surfaces.find((s) => s.surfaceId === node.surfaceId);
  const { volumeId, face } = surface.supportRef;
  if (face === 'adapter') return null;
  const volume = entry.space.volumes.find((v) => v.volumeId === volumeId);
  const adapter = shapeAdapters[volume.shape.kind];
  if (!adapter || typeof adapter.faceElevation !== 'function') return null;
  const local = adapter.faceElevation(volume.shape.p, face);
  const world = entry.space.frame.origin.y + local; // finite parts can still overflow when added
  return Number.isFinite(local) && Number.isFinite(world) ? world : null;
}

// A link id is unique world-wide (rev4:19): the same id in two Traversals is DUP_ID. `entries` is a list of
// {traversal, path}; no endpoint needs to be loaded for this check.
function checkLinkIds(entries) {
  const owner = new Map();
  for (const { traversal, path } of entries) {
    traversal.links.forEach((link, k) => {
      if (owner.has(link.linkId) && owner.get(link.linkId) !== traversal.spaceId) {
        throw new Fail('DUP_ID', `${path}/links/${k}/linkId`);
      }
      owner.set(link.linkId, traversal.spaceId);
    });
  }
}

// Resolves every link endpoint, including cross-Space targets, across a set of
// snapshots, keeps link ids unique world-wide and checks walk link elevations.
// Each snapshot must already pass validateSnapshot; this adds the checks no
// single Space can do.
function validateResolved(snapshots, options = {}) {
  if (!Array.isArray(snapshots)) throw new TypeError('validateResolved: expected an array');
  const shapeAdapters = options.shapeAdapters ?? DEFAULT_SHAPE_ADAPTERS;
  return run(() => {
    // a water body shared between Snapshots must agree whatever the order they are loaded in (rev4:24)
    checkWater(snapshots.flatMap((snapshot, i) => snapshot.spaces.map((space, j) => ({ space, path: `/${i}/spaces/${j}` }))));
    const nodesBySpace = new Map();
    const entries = new Map();
    for (const snapshot of snapshots) {
      const spaces = new Map(snapshot.spaces.map((s) => [s.spaceId, s]));
      for (const t of snapshot.traversals) {
        nodesBySpace.set(t.spaceId, new Set(t.nodes.map((n) => n.nodeId)));
        entries.set(t.spaceId, { space: spaces.get(t.spaceId), traversal: t });
      }
    }
    checkLinkIds(snapshots.flatMap((snapshot, i) => snapshot.traversals.map((traversal, j) => (
      { traversal, path: `/${i}/traversals/${j}` }))));
    snapshots.forEach((snapshot, i) => snapshot.traversals.forEach((t, j) => {
      t.links.forEach((link, k) => {
        const path = `/${i}/traversals/${j}/links/${k}`;
        for (const end of ['from', 'to']) {
          const nodes = nodesBySpace.get(link[end].spaceId);
          if (!nodes || !nodes.has(link[end].nodeId)) throw new Fail('BAD_REF', `${path}/${end}`);
        }
        if (link.kind !== 'walk') return;
        const a = nodeElevation(entries.get(link.from.spaceId), link.from.nodeId, shapeAdapters);
        const b = nodeElevation(entries.get(link.to.spaceId), link.to.nodeId, shapeAdapters);
        // Unresolved is not verified: a walk link needs both elevations.
        if (a === null) throw new Fail('UNKNOWN_SURFACE', `${path}/from`);
        if (b === null) throw new Fail('UNKNOWN_SURFACE', `${path}/to`);
        if (Math.abs(a - b) > WALK_ELEVATION_TOLERANCE) throw new Fail('BAD_REF', `${path}/to`);
      });
    }));
    return snapshots;
  });
}

// ---- v3/core/snapshot.js ----
// Snapshot: the canonical answer to one world query (Spaces plus their
// Traversals), identified by the query and guarded by a structural digest.






const DIGEST_RE = /^[0-9a-f]{64}$/;

// The digest covers the validated (canonical) Spaces and Traversals, never raw generator output.
const snapshotDigest = ({ worldId, spaces, traversals }) => sha256Hex(canonicalJson({ worldId, spaces, traversals }));

// Every check except the digest. queryWorld validates first and derives the digest from the result.
function checkSnapshotBody(value, options = {}) {
  const out = record(value, '', {
    formatVersion: version, worldId: objectId('w'), queryBounds: bounds,
    snapshotId: str, spaces: listOf(nested((s) => validateSpace(s, options))),
    traversals: listOf(plainObject), structuralDigest: pattern(DIGEST_RE),
  });
  const expectedId = makeSnapshotId(makeQueryKey(out.worldId, out.queryBounds));
  if (out.snapshotId !== expectedId) throw new Fail('BAD_QUERY_KEY', '/snapshotId');
  uniqueIds(out.spaces, '/spaces', (s) => s.spaceId);
  checkOrdered(out.spaces, '/spaces', (s) => s.spaceId);
  out.spaces.forEach((space, i) => {
    if (space.worldId !== out.worldId) throw new Fail('BAD_REF', `/spaces/${i}/worldId`);
  });
  const bySpace = new Map(out.spaces.map((s) => [s.spaceId, s]));
  out.traversals = out.traversals.map((raw, i) => {
    const idPath = `/traversals/${i}/spaceId`;
    if (!Object.hasOwn(raw, 'spaceId')) throw new Fail('MISSING_FIELD', idPath);
    // raw: no getter may run; the id is typed before it is looked up, so BAD_REF means a well-formed id with no Space
    const space = bySpace.get(objectId('s')(readOwn(raw, 'spaceId', `/traversals/${i}`), idPath));
    if (!space) throw new Fail('BAD_REF', idPath);
    return nested((t) => validateTraversal(t, space, options))(raw, `/traversals/${i}`);
  });
  uniqueIds(out.traversals, '/traversals', (t) => t.spaceId);
  checkOrdered(out.traversals, '/traversals', (t) => t.spaceId);
  // ids are unique and each names a Space here, so equal counts mean every Space has its one Traversal
  if (out.traversals.length !== out.spaces.length) throw new Fail('BAD_REF', '/traversals');
  checkLinkIds(out.traversals.map((traversal, i) => ({ traversal, path: `/traversals/${i}` })));
  checkWater(out.spaces.map((space, i) => ({ space, path: `/spaces/${i}` })));
  return out;
}

function validateSnapshot(value, options = {}) {
  requireObject(value, 'validateSnapshot');
  return run(() => {
    const out = checkSnapshotBody(value, options);
    if (snapshotDigest(out) !== out.structuralDigest) throw new Fail('BAD_DIGEST', '/structuralDigest');
    return out;
  });
}

function plainObject(value, path) {
  if (!isPlain(value)) throw new Fail('BAD_TYPE', path);
  return value;
}

// ---- v3/core/world.js ----
// World descriptor: pure JSON that fully describes the structural identity of a
// world, so a Worker can rebuild it from the descriptor alone.






const slotList = listOf(localKey);

const fingerprintField = (v, p) => {
  if (!isFingerprint(v)) throw new Fail(typeof v === 'string' ? 'BAD_FIELD' : 'BAD_TYPE', p);
  return v;
};

const structuralConfigShape = (v, p) => record(v, p, {
  cellSize: (x, pt) => { const n = num(x, pt); if (!(n > 0)) throw new Fail('BAD_RANGE', pt); return n; },
  maxSpaceExtent: (x, pt) => { const n = num(x, pt); if (!(n >= 0)) throw new Fail('BAD_RANGE', pt); return n; },
});

const journeyConfigShape = (v, p) => record(v, p, {
  regionSlotIds: slotList, landmarkSlotIds: slotList, exitSlotId: localKey,
  segments: listOf(num), objectiveIds: listOf(str),
});

const moduleRef = (v, p) => record(v, p, {
  kind: (k, pt) => oneOf(k, pt, ['region', 'landmark']), slotId: localKey, moduleId: str,
  moduleVersion: (x, pt) => int(x, pt, 1),
});

const adapterRef = (v, p) => record(v, p, {
  adapterId: str, adapterVersion: (x, pt) => int(x, pt, 1),
});

// Relations between Journey fields and modules that no single field checker sees (rev3:72): one segment more
// than regions, no negative distance, no slot shared by a region and a landmark, every module in a listed slot
// and every listed slot pinned to a module (rev5:15).
function checkJourney(journey, modules, base) {
  const { regionSlotIds, landmarkSlotIds, segments } = journey;
  if (segments.length !== regionSlotIds.length + 1) throw new Fail('BAD_RANGE', `${base}/journeyConfig/segments`);
  segments.forEach((s, i) => {
    if (!(s >= 0)) throw new Fail('BAD_RANGE', `${base}/journeyConfig/segments/${i}`);
  });
  landmarkSlotIds.forEach((id, i) => {
    if (regionSlotIds.includes(id)) throw new Fail('DUP_ID', `${base}/journeyConfig/landmarkSlotIds/${i}`);
  });
  modules.forEach((m, i) => {
    const slots = m.kind === 'region' ? regionSlotIds : landmarkSlotIds;
    if (!slots.includes(m.slotId)) throw new Fail('BAD_REF', `${base}/modules/${i}`);
  });
  const pinned = new Set(modules.map((m) => `${m.kind}/${m.slotId}`));
  [['region', regionSlotIds], ['landmark', landmarkSlotIds]].forEach(([kind, slots]) => {
    slots.forEach((id, i) => {
      if (!pinned.has(`${kind}/${id}`)) throw new Fail('BAD_REF', `${base}/journeyConfig/${kind}SlotIds/${i}`);
    });
  });
}

function validateWorld(value) {
  requireObject(value, 'validateWorld');
  return run(() => {
    const out = record(value, '', {
      formatVersion: version, worldId: objectId('w'),
      seed: (v, p) => int(v, p, 0, SEED_MAX), configFingerprint: fingerprintField,
      generatorFormat: (v, p) => int(v, p, 1), structuralConfig: structuralConfigShape,
      journeyConfig: journeyConfigShape, units: literal('m'), regionSlotIds: slotList,
      modules: listOf(moduleRef), adapters: listOf(adapterRef),
    });
    const id = parseWorldObjectId(out.worldId).value;
    if (id.seed !== out.seed) throw new Fail('BAD_REF', '/seed');
    if (id.configFingerprint !== out.configFingerprint) throw new Fail('BAD_REF', '/configFingerprint');
    uniqueIds(out.journeyConfig.regionSlotIds, '/journeyConfig/regionSlotIds');
    uniqueIds(out.journeyConfig.landmarkSlotIds, '/journeyConfig/landmarkSlotIds');
    uniqueIds(out.regionSlotIds, '/regionSlotIds');
    uniqueIds(out.modules, '/modules', (m) => `${m.kind}/${m.slotId}`);
    uniqueIds(out.modules, '/modules', (m) => m.moduleId); // one module fills one slot (rev3:36)
    uniqueIds(out.adapters, '/adapters', (a) => a.adapterId);
    checkOrdered(out.adapters, '/adapters', (a) => a.adapterId); // rev5:48
    checkJourney(out.journeyConfig, out.modules, '');
    const journeyRegions = out.journeyConfig.regionSlotIds;
    if (out.regionSlotIds.length !== journeyRegions.length || out.regionSlotIds.some((id, i) => id !== journeyRegions[i])) {
      throw new Fail('BAD_REF', '/regionSlotIds');
    }
    if (makeConfigFingerprint(out) !== out.configFingerprint) {
      throw new Fail('BAD_REF', '/configFingerprint');
    }
    return out;
  });
}

// ---------------------------------------------------------------------------
// Composition and query (slice 2). A WorldContext is an immutable value built
// from explicit inputs; it holds no cache, so a query depends only on the
// context and the bounds, never on earlier queries.
//
// Region ownership: a Space belongs to the cell that holds its frame origin,
// cell = floor(origin / cellSize) on x and z. Its bounds may reach past that
// cell by at most structuralConfig.maxSpaceExtent on each side (x and z).
// Landmarks use the same cell-owned generate() contract as regions; they differ
// only in ownerKind ('landmark', l-kind ownerId) and add no journey segment.
// ---------------------------------------------------------------------------

// Guard against a bounds value that would enumerate an unreasonable cell count.
const MAX_QUERY_CELLS = 4096;

// Deep copy and freeze of adapter data: plain objects, arrays, primitives and functions only. Anything else
// (Map, class instance, Symbol...) cannot be frozen into a stable value, so it is BAD_TYPE.
// Cycles, accessors (a getter would run caller code), symbol keys, array holes and extra array properties
// are BAD_TYPE too: none of them survives a faithful copy. `path` holds the objects being copied, so a
// reference shared by two branches is fine and only a true cycle is rejected.
function dataEntries(v, p, skip = null) {
  return Reflect.ownKeys(v).filter((key) => key !== skip).map((key) => {
    const d = typeof key === 'string' ? Object.getOwnPropertyDescriptor(v, key) : null;
    if (!d || !d.enumerable || !('value' in d)) throw new Fail('BAD_TYPE', at(p, key));
    return [key, d.value];
  });
}

function freezeCopy(v, p, path = new Set()) {
  if (typeof v === 'symbol' || typeof v === 'bigint') throw new Fail('BAD_TYPE', p);
  if (v === null || typeof v !== 'object') return v; // primitives and functions
  if (path.has(v)) throw new Fail('BAD_TYPE', p);
  const isArray = Array.isArray(v);
  if (!isArray && !isPlain(v)) throw new Fail('BAD_TYPE', p);
  path.add(v);
  try {
    const entries = dataEntries(v, p, isArray ? 'length' : null);
    if (isArray && (entries.length !== v.length || entries.some(([key], i) => key !== String(i)))) {
      throw new Fail('BAD_TYPE', p);
    }
    const copy = entries.map(([key, item]) => [key, freezeCopy(item, at(p, key), path)]);
    if (isArray) return Object.freeze(copy.map(([, item]) => item));
    const out = {};
    for (const [key, item] of copy) setOwn(out, key, item);
    return Object.freeze(out);
  } finally {
    path.delete(v);
  }
}

// A table of plain adapter objects, deep-copied and frozen: later edits to the caller's table, its adapters or
// their data cannot change what a composed world validates with. `needs` names the method every entry must have.
const adapterTable = (needs) => (v, p) => {
  if (!isPlain(v)) throw new Fail('BAD_TYPE', p);
  const out = {};
  for (const [key, adapter] of dataEntries(v, p)) {
    if (!isPlain(adapter)) throw new Fail('BAD_TYPE', at(p, key));
    const copy = freezeCopy(adapter, at(p, key)); // before any property read: a getter must not run
    if (needs && typeof copy[needs] !== 'function') throw new Fail('BAD_TYPE', at(p, key));
    if (Object.hasOwn(copy, 'versions')) { // the versions an adapter claims: a non-empty list of integers of at least 1
      const versionsPath = at(at(p, key), 'versions');
      const versions = list(copy.versions, versionsPath, (x, vp) => int(x, vp, 1));
      if (versions.length === 0) throw new Fail('BAD_TYPE', versionsPath);
    }
    setOwn(out, key, copy);
  }
  return Object.freeze(out);
};

const configShape = (value) => record(value, '/config', {
  seed: (v, p) => int(v, p, 0, SEED_MAX), generatorFormat: (v, p) => int(v, p, 1),
  structuralConfig: structuralConfigShape, journeyConfig: journeyConfigShape,
  modules: listOf(moduleRef), adapters: listOf(adapterRef),
}, { atmosphere: json });

const sub = (path, p) => `${path}${p === '/' ? '' : p}`;

// Checks one registry list of `kind` and returns the entries for `slots`, in slot order.
function registryEntries(registry, kind, slots, config, extAdapters) {
  const name = `${kind}s`;
  const bySlot = new Map();
  list(readOwn(registry, name, '/registry'), `/registry/${name}`, (entry, path) => {
    const { descriptor, generate } = readModuleEntry(entry, path);
    if (typeof generate !== 'function') throw new Fail('BAD_TYPE', `${path}/generate`);
    const checked = validateModuleDescriptor(descriptor, { extAdapters });
    if (!checked.ok) throw new Fail(checked.code, sub(`${path}/descriptor`, checked.path));
    const d = checked.value;
    if (d.kind !== kind) throw new Fail('BAD_FIELD', `${path}/descriptor/kind`);
    if (bySlot.has(d.slotId)) throw new Fail('DUP_ID', `${path}/descriptor/slotId`);
    bySlot.set(d.slotId, Object.freeze({
      slotId: d.slotId, kind, descriptor: deepFreeze(d), generate }));
  });
  return slots.map((slotId, i) => {
    const entry = bySlot.get(slotId);
    const pinned = config.modules.find((m) => m.kind === kind && m.slotId === slotId);
    if (!entry || !pinned) throw new Fail('BAD_REF', `/config/journeyConfig/${kind}SlotIds/${i}`);
    if (entry.descriptor.moduleId !== pinned.moduleId
      || entry.descriptor.moduleVersion !== pinned.moduleVersion) {
      throw new Fail('BAD_REF', `/config/modules/${config.modules.indexOf(pinned)}`);
    }
    return entry;
  });
}

function registryModules(registry, config, extAdapters) {
  const { regionSlotIds, landmarkSlotIds } = config.journeyConfig;
  checkJourney(config.journeyConfig, config.modules, '/config');
  return {
    regions: registryEntries(registry, 'region', regionSlotIds, config, extAdapters),
    landmarks: registryEntries(registry, 'landmark', landmarkSlotIds, config, extAdapters),
  };
}

// Builds the World descriptor and an immutable WorldContext from explicit
// inputs. `atmosphere` and other non-structural config never reaches the
// descriptor, the fingerprint or a module's generate().
function composeWorld(config, registry, adapters) {
  requireObject(config, 'composeWorld(config)');
  requireObject(registry, 'composeWorld(registry)');
  requireObject(adapters, 'composeWorld(adapters)');
  return run(() => {
    const cfg = configShape(config);
    // surfaceAdapters is reserved for resolving `adapter` support faces (rev5 s4); nothing dispatches to it yet
    const table = record(adapters, '/adapters', {
      shapeAdapters: adapterTable('validate'), featureAdapters: adapterTable('validate'),
    }, { surfaceAdapters: adapterTable(), extAdapters: adapterTable('validate') });
    const { regions, landmarks } = registryModules(registry, cfg, table.extAdapters);
    const configFingerprint = makeConfigFingerprint(cfg);
    const checked = validateWorld({
      formatVersion: 1, worldId: makeWorldObjectId('w', cfg.seed, configFingerprint, 'root'),
      seed: cfg.seed, configFingerprint, generatorFormat: cfg.generatorFormat,
      structuralConfig: cfg.structuralConfig, journeyConfig: cfg.journeyConfig, units: 'm',
      regionSlotIds: [...cfg.journeyConfig.regionSlotIds], modules: cfg.modules,
      adapters: [...cfg.adapters].sort((a, b) => (a.adapterId < b.adapterId ? -1 : a.adapterId > b.adapterId ? 1 : 0)),
    });
    if (!checked.ok) throw new Fail(checked.code, sub('/descriptor', checked.path));
    const descriptor = deepFreeze(checked.value);
    const generatorConfig = deepFreeze({
      seed: descriptor.seed, generatorFormat: descriptor.generatorFormat,
      structuralConfig: descriptor.structuralConfig, journeyConfig: descriptor.journeyConfig,
      modules: descriptor.modules, adapters: descriptor.adapters,
    });
    const context = Object.freeze({
      descriptor, generatorConfig, regions: Object.freeze(regions), landmarks: Object.freeze(landmarks),
      adapters: Object.freeze({
        shapeAdapters: table.shapeAdapters, featureAdapters: table.featureAdapters,
        surfaceAdapters: table.surfaceAdapters ?? Object.freeze({}),
        extAdapters: table.extAdapters ?? Object.freeze({}) }),
    });
    return { descriptor, context };
  });
}

// Programmer-error check for a context handed to queryWorld or the journey.
function assertContext(context, name) {
  if (context === null || typeof context !== 'object' || !isPlain(context.descriptor)
    || !Array.isArray(context.regions) || !Array.isArray(context.landmarks)
    || !isPlain(context.generatorConfig)) {
    throw new TypeError(`${name}: expected a WorldContext from composeWorld`);
  }
}

const cellRange = (lo, hi, size, extent) => ({
  from: Math.floor((lo - extent) / size), to: Math.ceil((hi + extent) / size) - 1,
});

// A generated Space must sit in its owner cell and stay within maxSpaceExtent.
function checkOwnedSpace(space, cell, size, extent, path) {
  if (!isPlain(space) || !isPlain(space.frame)) throw new Fail('BAD_TYPE', path);
  const origin = vec3(space.frame.origin, `${path}/frame/origin`);
  const box = bounds(space.bounds, `${path}/bounds`);
  if (Math.floor(origin.x / size) !== cell.ix || Math.floor(origin.z / size) !== cell.iz) {
    throw new Fail('BAD_REF', `${path}/frame/origin`);
  }
  for (const [axis, index] of [['x', cell.ix], ['z', cell.iz]]) {
    if (box.min[axis] < index * size - extent || box.max[axis] > (index + 1) * size + extent) {
      throw new Fail('BAD_RANGE', `${path}/bounds`);
    }
  }
  return box;
}

// A module may publish only Spaces it owns: its own kind and its own slot. Without this a region could
// claim a landmark's id and shadow that slot's Spaces in the Snapshot.
function checkOwner(space, module, path) {
  const parsed = typeof space.ownerId === 'string' ? parseWorldObjectId(space.ownerId) : null;
  if (space.ownerKind !== module.kind || !parsed?.ok || parsed.value.localKey !== module.slotId) {
    throw new Fail('BAD_REF', `${path}/ownerId`);
  }
}

const intersects = (a, b) => ['x', 'y', 'z'].every(
  (axis) => a.max[axis] > b.min[axis] && a.min[axis] < b.max[axis]);

const bySpaceId = (a, b) => (a.spaceId < b.spaceId ? -1 : a.spaceId > b.spaceId ? 1 : 0);

// Returns the Snapshot of every Space whose bounds intersect `queryBounds`
// (half-open: touching faces do not count), sorted by spaceId.
function queryWorld(context, queryBounds) {
  assertContext(context, 'queryWorld');
  requireObject(queryBounds, 'queryWorld(bounds)');
  return run(() => {
    const q = bounds(queryBounds, '/bounds');
    const { descriptor, generatorConfig, adapters } = context;
    const { cellSize, maxSpaceExtent } = descriptor.structuralConfig;
    const xs = cellRange(q.min.x, q.max.x, cellSize, maxSpaceExtent);
    const zs = cellRange(q.min.z, q.max.z, cellSize, maxSpaceExtent);
    // Past 2^53 `ix++` stops advancing, so the loops below would never end; reject before counting.
    const safe = [xs.from, xs.to, zs.from, zs.to].every(Number.isSafeInteger);
    if (!safe || (xs.to - xs.from + 1) * (zs.to - zs.from + 1) > MAX_QUERY_CELLS) {
      throw new Fail('BAD_RANGE', '/bounds');
    }
    const spaces = [];
    const traversalBySpace = new Map(); // spaceId -> Traversal, one entry per Space the modules publish
    for (const module of [...context.regions, ...context.landmarks]) {
      for (let ix = xs.from; ix <= xs.to; ix++) {
        for (let iz = zs.from; iz <= zs.to; iz++) {
          const cell = { ix, iz };
          const where = at(at('/generate', module.slotId), `${ix},${iz}`);
          // a plain JSON copy first: generator output is untrusted, so no getter of it may run in the reads below
          const out = json(module.generate({
            worldId: descriptor.worldId, seed: descriptor.seed, slotId: module.slotId,
            cell, config: generatorConfig }), where);
          if (!isPlain(out) || !Array.isArray(out.spaces) || !Array.isArray(out.traversals)) {
            throw new Fail('BAD_TYPE', where);
          }
          // a module's traversals pair one to one with the Spaces it publishes in this call
          const own = new Map();
          for (const t of out.traversals) {
            if (!isPlain(t) || typeof t.spaceId !== 'string') {
              throw new Fail('BAD_TYPE', `${where}/traversals`);
            }
            if (own.has(t.spaceId)) throw new Fail('DUP_ID', `${where}/traversals`);
            own.set(t.spaceId, t);
          }
          out.spaces.forEach((space, i) => {
            const at = `${where}/spaces/${i}`;
            const box = checkOwnedSpace(space, cell, cellSize, maxSpaceExtent, at);
            checkOwner(space, module, at);
            if (!own.has(space.spaceId)) throw new Fail('BAD_REF', `${where}/traversals`);
            if (traversalBySpace.has(space.spaceId)) throw new Fail('DUP_ID', `${at}/spaceId`);
            traversalBySpace.set(space.spaceId, own.get(space.spaceId));
            if (intersects(box, q)) spaces.push(space);
          });
          if (own.size !== out.spaces.length) throw new Fail('BAD_REF', `${where}/traversals`);
        }
      }
    }
    spaces.sort(bySpaceId);
    const traversals = spaces.map((s) => traversalBySpace.get(s.spaceId));
    // validate first, then derive the digest from the validated data (a generator's NaN fails here, not in hashing)
    const draft = {
      formatVersion: 1, worldId: descriptor.worldId, queryBounds: q,
      snapshotId: makeSnapshotId(makeQueryKey(descriptor.worldId, q)), spaces, traversals,
      structuralDigest: '0'.repeat(64),
    };
    const body = checkSnapshotBody(draft, adapters);
    return deepFreeze({ ...body, structuralDigest: snapshotDigest(body) });
  });
}

// ---- v3/modules/registry.js ----
// Static module registry: the one value that says which generation modules exist.
// Modules never register themselves; a composition file builds the registry from
// explicit imports (see registry-config.js), so adding or replacing a module is a
// source edit that the builder and the import-boundary tests can see.



// Validates one module list of the registry envelope, read as own data (no getter runs, no hole passes).
// `seen` tracks slots and module IDs across both lists: a slot belongs to exactly one module, whatever its kind.
function registryList(modules, kind, seen, options) {
  const name = `${kind}s`;
  return list(readOwn(modules, name, ''), `/${name}`, (entry, path) => {
    const { descriptor, generate } = readModuleEntry(entry, path);
    const checked = validateModuleDescriptor(descriptor, options);
    if (!checked.ok) throw new Fail(checked.code, `${path}/descriptor${checked.path === '/' ? '' : checked.path}`);
    if (typeof generate !== 'function') throw new Fail('BAD_TYPE', `${path}/generate`);
    const d = checked.value;
    if (d.kind !== kind) throw new Fail('BAD_FIELD', `${path}/descriptor/kind`);
    if (seen.slots.has(d.slotId)) throw new Fail('DUP_SLOT', `${path}/descriptor/slotId`);
    if (seen.moduleIds.has(d.moduleId)) throw new Fail('DUP_MODULE', `${path}/descriptor/moduleId`);
    seen.slots.add(d.slotId);
    seen.moduleIds.add(d.moduleId);
    return Object.freeze({ descriptor: deepFreeze(d), generate });
  });
}

// createRegistry({ regions, landmarks }) -> Result<frozen { regions, landmarks }>.
// Each module is { descriptor: ModuleDescriptor, generate(ctx) }. `options.extAdapters` is the registered
// namespace table for a descriptor's `ext` (rev4:35); without it a descriptor with `ext` content is rejected.
function createRegistry(modules, options = {}) {
  requireObject(modules, 'createRegistry');
  requireObject(options, 'createRegistry(options)');
  return run(() => {
    const seen = { slots: new Set(), moduleIds: new Set() };
    const regions = registryList(modules, 'region', seen, options);
    const landmarks = registryList(modules, 'landmark', seen, options);
    return Object.freeze({ regions: Object.freeze(regions), landmarks: Object.freeze(landmarks) });
  });
}

// ---- v3/modules/regions/stub-region.js ----
// P1 stub region: a placeholder that proves the registry and query path.
// It owns one 8 m box room in every cell. Generation modules import core only,
// so the stub carries its own small generator instead of sharing one with the landmark stub.


const STUB_REGION_ROOM = 8;
const STUB_REGION_HEIGHT = 5;

function stubRegion(slotId) {
  return {
    descriptor: {
      formatVersion: 1, moduleId: `stub.${slotId}`, moduleVersion: 1, kind: 'region', slotId, featureSpecs: [],
    },
    generate(ctx) {
      const { configFingerprint } = parseWorldObjectId(ctx.worldId).value;
      const size = ctx.config.structuralConfig.cellSize;
      // the room fits its owner cell for any cellSize: the offsets and the room shrink with a small cell
      const room = Math.min(STUB_REGION_ROOM, size / 2);
      const x = ctx.cell.ix * size + Math.min(4, size / 4);
      const z = ctx.cell.iz * size + Math.min(3, size / 4);
      const key = `${slotId}.${encodeCoordinate(ctx.cell.ix)}.${encodeCoordinate(ctx.cell.iz)}`;
      const spaceId = makeWorldObjectId('s', ctx.seed, configFingerprint, key);
      const space = {
        formatVersion: 1, spaceId, worldId: ctx.worldId, ownerKind: 'region',
        ownerId: makeWorldObjectId('r', ctx.seed, configFingerprint, slotId),
        frame: { origin: { x, y: 0, z } },
        bounds: {
          min: { x, y: 0, z }, max: { x: x + room, y: STUB_REGION_HEIGHT, z: z + room } },
        levels: [{ levelId: 'ground', datumY: 0 }],
        volumes: [{
          volumeId: 'air', kind: 'open', levelId: 'ground',
          shape: { kind: 'box', v: 1, p: {
            min: { x: 0, y: 0, z: 0 }, max: { x: room, y: STUB_REGION_HEIGHT, z: room } } },
        }],
        portals: [], features: [], access: 'traversable',
      };
      return {
        spaces: [space],
        traversals: [{ formatVersion: 1, spaceId, nodes: [], surfaces: [], links: [], blockedVolumeIds: [] }],
      };
    },
  };
}

// ---- v3/modules/landmarks/stub-landmark.js ----

// modules import core only, so this file carries its own small generator.

const STUB_LANDMARK_HEIGHT = 5;

        bounds: {
          min: { x, y: 0, z }, max: { x: x + room, y: STUB_LANDMARK_HEIGHT, z: z + room } },
        levels: [{ levelId: 'ground', datumY: 0 }],

      return {
        spaces: [space],
        traversals: [{ formatVersion: 1, spaceId, nodes: [], surfaces: [], links: [], blockedVolumeIds: [] }],
      };
    },
  };
}

// ---- v3/modules/registry-config.js ----
// Composition file: the default registry. To add a region or replace a landmark, add its folder
// under modules/ and edit only the imports and the lists below (and journey-config.js slots).




// -> Result<Registry>
function createDefaultRegistry() {
  return createRegistry({
    regions: ['region01', 'region02', 'region03', 'region04'].map((slotId) => stubRegion(slotId)),
    landmarks: [stubLandmark('landmark01')],
  });
}

// ---- v3/modules/adapters.js ----
// Composition file: the default adapter tables handed to composeWorld.


function createDefaultAdapters() {
  return { shapeAdapters: DEFAULT_SHAPE_ADAPTERS, featureAdapters: DEFAULT_FEATURE_ADAPTERS };
}

// ---- v3/modules/world-config.js ----
// Composition file: the default structural config. `cellSize` and `maxSpaceExtent` live only here
// (and in the config a World descriptor stores); `maxSpaceExtent` limits X and Z only.
const DEFAULT_STRUCTURAL_CONFIG = Object.freeze({
  cellSize: 64,
  maxSpaceExtent: 64,
});

// ---- v3/modules/journey-config.js ----
// Composition file: the default journey. Slot IDs here must match registry-config.js.
// `segments` has one more entry than `regionSlotIds` (start -> region 1 ... region N -> exit).
const DEFAULT_JOURNEY_CONFIG = Object.freeze({
  regionSlotIds: Object.freeze(['region01', 'region02', 'region03', 'region04']),
  landmarkSlotIds: Object.freeze(['landmark01']),
  exitSlotId: 'exit01',
  segments: Object.freeze([40, 40, 40, 40, 40]),
  objectiveIds: Object.freeze([]),
});

// ---- v3/diagnostic/view.js ----
// P1 pure summary and diagnostic DOM rendering. No imports from entry/ or v1.
function buildP1Summary(descriptor, snapshot) {
  if (!descriptor || typeof descriptor !== 'object' ||
      !snapshot || typeof snapshot !== 'object') {
    throw new TypeError('P1 summary requires a descriptor and a snapshot');
  }
  if (!Number.isInteger(descriptor.seed) || descriptor.seed < 0 ||
      descriptor.seed > 4294967295 ||
      typeof descriptor.worldId !== 'string' ||
      !Array.isArray(descriptor.modules) ||
      snapshot.worldId !== descriptor.worldId ||
      !Array.isArray(snapshot.spaces) ||
      typeof snapshot.structuralDigest !== 'string' ||
      !/^[0-9a-f]{64}$/.test(snapshot.structuralDigest)) {
    throw new TypeError('Invalid P1 world descriptor or snapshot');
  }
  return Object.freeze({
    seed: descriptor.seed,
    worldId: descriptor.worldId,
    moduleCount: descriptor.modules.length,
    spaceCount: snapshot.spaces.length,
    structuralDigest: snapshot.structuralDigest,
  });
}

function renderP1Diagnostic(state) {
  const status = document.getElementById('p1-status');
  const error = document.getElementById('p1-error');
  const details = document.getElementById('p1-summary');
  error.hidden = true;
  details.hidden = true;
  error.textContent = '';

  if (state.error) {
    status.textContent = 'P1 initialization failed';
    error.textContent = `${state.error.code}: ${state.error.message}`;
    error.hidden = false;
    return;
  }
  if (!state.ready) {
    status.textContent = 'Initializing P1…';
    return;
  }
  const fields = {
    'p1-seed': state.summary.seed,
    'p1-world-id': state.summary.worldId,
    'p1-module-count': state.summary.moduleCount,
    'p1-space-count': state.summary.spaceCount,
    'p1-structural-digest': state.summary.structuralDigest,
  };
  for (const [id, value] of Object.entries(fields)) {
    document.getElementById(id).textContent = String(value);
  }
  details.hidden = false;
  status.textContent = 'P1 diagnostic ready';
}

// ---- v3/entry/main.js ----
// P1 diagnostic entry. Build with --entry js/v3/entry/main.js.







const P1_DEFAULT_SEED = 42;
const P1_QUERY_BOUNDS = Object.freeze({
  min: Object.freeze({ x: 0, y: -2, z: 0 }),
  max: Object.freeze({ x: 32, y: 8, z: 16 }),
});

function parseP1Seed() {
  const raw = new URLSearchParams(location.search).get('seed');
  if (raw === null) return P1_DEFAULT_SEED;
  if (!/^(0|[1-9][0-9]*)$/.test(raw)) {
    const error = new RangeError('seed must be a decimal uint32');
    error.code = 'P1_INVALID_SEED';
    throw error;
  }
  const seed = Number(raw);
  if (!Number.isSafeInteger(seed) || seed > 4294967295) {
    const error = new RangeError('seed must be between 0 and 4294967295');
    error.code = 'P1_INVALID_SEED';
    throw error;
  }
  return seed;
}

function requireP1Result(result, stage) {
  if (result?.ok === true) return result.value;
  const error = new Error(`${stage}: ${result?.code ?? 'UNKNOWN'} at ${result?.path ?? '/'}`);
  error.code = result?.code ?? 'P1_BOOT_FAILED';
  throw error;
}

window.__deependV3 = { ready: false, error: null, summary: null };
renderP1Diagnostic(window.__deependV3);
try {
  const seed = parseP1Seed();
  const registry = requireP1Result(createDefaultRegistry(), 'registry');
  const modules = [...registry.regions, ...registry.landmarks].map(({ descriptor }) => ({
    kind: descriptor.kind,
    slotId: descriptor.slotId,
    moduleId: descriptor.moduleId,
    moduleVersion: descriptor.moduleVersion,
  }));
  const config = {
    seed,
    generatorFormat: 1,
    structuralConfig: DEFAULT_STRUCTURAL_CONFIG,
    journeyConfig: DEFAULT_JOURNEY_CONFIG,
    modules,
    adapters: [],
  };
  const world = requireP1Result(
    composeWorld(config, registry, createDefaultAdapters()), 'composeWorld');
  const snapshot = requireP1Result(
    queryWorld(world.context, P1_QUERY_BOUNDS), 'queryWorld');
  const summary = buildP1Summary(world.descriptor, snapshot);
  window.__deependV3 = { ready: true, error: null, summary };
} catch (error) {
  window.__deependV3 = {
    ready: false,
    error: { code: error?.code || 'P1_BOOT_FAILED', message: String(error?.message || error) },
    summary: null,
  };
}
renderP1Diagnostic(window.__deependV3);

</script>
