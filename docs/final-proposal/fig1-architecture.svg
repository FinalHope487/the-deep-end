<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="730" viewBox="0 0 1240 730" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a2e"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#e7ebec"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c9d1d3" stroke-width="3"/></pattern><pattern id="ovl" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#b45309" stroke-width="2"/></pattern></defs><rect width="1240" height="730" fill="#ffffff"/><text x="40" y="50" font-size="26" fill="#1f2a2e" font-weight="700" text-anchor="start">圖 1　系統架構：生成、執行、建置三層</text><text x="40" y="80" font-size="15" fill="#5b6b70" font-weight="400" text-anchor="start">內容生成是純函數（同一個種子永遠得到同一張地圖）；瀏覽器只負責顯示與互動；最後合併成一個 HTML 檔發布。</text><rect x="40" y="105" width="370" height="600" rx="14" fill="none" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="4 4"/><text x="58" y="135" font-size="18" fill="#0f766e" font-weight="700" text-anchor="start">① 內容生成（純函數，無 I/O）</text><rect x="440" y="105" width="370" height="600" rx="14" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 4"/><text x="458" y="135" font-size="18" fill="#2563eb" font-weight="700" text-anchor="start">② 遊戲執行（瀏覽器）</text><rect x="840" y="105" width="370" height="600" rx="14" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 4"/><text x="858" y="135" font-size="18" fill="#b45309" font-weight="700" text-anchor="start">③ 建置、測試與發布</text><rect x="58" y="155" width="334" height="105" rx="10" fill="#f3faf9" stroke="#0f766e" stroke-width="2"/><text x="72" y="182" font-size="17" fill="#1f2a2e" font-weight="700" text-anchor="start">種子 seed ＋ 世界座標</text><text x="72" y="207" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">同一種子 → 同一張地圖</text><line x1="225" y1="260" x2="225" y2="281" stroke="#1f2a2e" stroke-width="2" marker-end="url(#ar)"/><rect x="58" y="283" width="334" height="105" rx="10" fill="#f3faf9" stroke="#0f766e" stroke-width="2"/><text x="72" y="310" font-size="17" fill="#1f2a2e" font-weight="700" text-anchor="start">房間分割與走道</text><text x="72" y="335" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">不規則直角房間（像俄羅斯方塊）</text><text x="72" y="356" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">大廳數十公尺、小房 10 m 內</text><line x1="225" y1="388" x2="225" y2="409" stroke="#1f2a2e" stroke-width="2" marker-end="url(#ar)"/><rect x="58" y="411" width="334" height="105" rx="10" fill="#f3faf9" stroke="#0f766e" stroke-width="2"/><text x="72" y="438" font-size="17" fill="#1f2a2e" font-weight="700" text-anchor="start">牆體與開口</text><text x="72" y="463" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">填充牆 ≥ 2 m，接縫不外露</text><text x="72" y="484" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">門洞、窗、封閉房</text><line x1="225" y1="516" x2="225" y2="537" stroke="#1f2a2e" stroke-width="2" marker-end="url(#ar)"/><rect x="58" y="539" width="334" height="105" rx="10" fill="#f3faf9" stroke="#0f766e" stroke-width="2"/><text x="72" y="566" font-size="17" fill="#1f2a2e" font-weight="700" text-anchor="start">世界契約 queryWorld(cell)</text><text x="72" y="591" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">回傳 Space／Traversal 資料</text><text x="72" y="612" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">擴充點：橋、水體、滑梯</text><rect x="458" y="155" width="334" height="105" rx="10" fill="#f3f6fd" stroke="#2563eb" stroke-width="2"/><text x="472" y="182" font-size="17" fill="#1f2a2e" font-weight="700" text-anchor="start">區塊串流</text><text x="472" y="207" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">玩家附近即時生成，遠處卸載</text><text x="472" y="228" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">可無限往外走</text><line x1="625" y1="260" x2="625" y2="281" stroke="#1f2a2e" stroke-width="2" marker-end="url(#ar)"/><rect x="458" y="283" width="334" height="105" rx="10" fill="#f3f6fd" stroke="#2563eb" stroke-width="2"/><text x="472" y="310" font-size="17" fill="#1f2a2e" font-weight="700" text-anchor="start">three.js 渲染</text><text x="472" y="335" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">每區塊合併網格、光照烘進頂點色</text><text x="472" y="356" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">自動畫質</text><line x1="625" y1="388" x2="625" y2="409" stroke="#1f2a2e" stroke-width="2" marker-end="url(#ar)"/><rect x="458" y="411" width="334" height="105" rx="10" fill="#f3f6fd" stroke="#2563eb" stroke-width="2"/><text x="472" y="438" font-size="17" fill="#1f2a2e" font-weight="700" text-anchor="start">玩家控制與碰撞</text><text x="472" y="463" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">鍵盤滑鼠／手機觸控搖桿</text><text x="472" y="484" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">涉水、樓梯、跳轉關卡</text><line x1="625" y1="516" x2="625" y2="537" stroke="#1f2a2e" stroke-width="2" marker-end="url(#ar)"/><rect x="458" y="539" width="334" height="105" rx="10" fill="#f3f6fd" stroke="#2563eb" stroke-width="2"/><text x="472" y="566" font-size="17" fill="#1f2a2e" font-weight="700" text-anchor="start">旅程、氛圍與存檔</text><text x="472" y="591" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">4 個地標、探索度、壓抑度</text><text x="472" y="612" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">Web Audio 3D 聲音、localStorage</text><rect x="858" y="155" width="334" height="105" rx="10" fill="#fdf8f1" stroke="#b45309" stroke-width="2"/><text x="872" y="182" font-size="17" fill="#1f2a2e" font-weight="700" text-anchor="start">原生 JS 模組 js/*.js</text><text x="872" y="207" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">只用具名 import、無循環相依</text><line x1="1025" y1="260" x2="1025" y2="281" stroke="#1f2a2e" stroke-width="2" marker-end="url(#ar)"/><rect x="858" y="283" width="334" height="105" rx="10" fill="#fdf8f1" stroke="#b45309" stroke-width="2"/><text x="872" y="310" font-size="17" fill="#1f2a2e" font-weight="700" text-anchor="start">tools/build.mjs 合併</text><text x="872" y="335" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">CSS＋全部 JS 內嵌</text><text x="872" y="356" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">名稱衝突即報錯</text><line x1="1025" y1="388" x2="1025" y2="409" stroke="#1f2a2e" stroke-width="2" marker-end="url(#ar)"/><rect x="858" y="411" width="334" height="105" rx="10" fill="#fdf8f1" stroke="#b45309" stroke-width="2"/><text x="872" y="438" font-size="17" fill="#1f2a2e" font-weight="700" text-anchor="start">dist/index.html（單一檔）</text><text x="872" y="463" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">離線可開；音檔在 dist/audio/</text><line x1="1025" y1="516" x2="1025" y2="537" stroke="#1f2a2e" stroke-width="2" marker-end="url(#ar)"/><rect x="858" y="539" width="334" height="105" rx="10" fill="#fdf8f1" stroke="#b45309" stroke-width="2"/><text x="872" y="566" font-size="17" fill="#1f2a2e" font-weight="700" text-anchor="start">GitHub Actions → Pages</text><text x="872" y="591" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">每次推送自動建置、發布</text><text x="872" y="612" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">版本封存：?gen=v3&amp;phase=pN</text><path d="M392,544 C424,544 424,207 456,207" fill="none" stroke="#1f2a2e" stroke-width="2" marker-end="url(#ar)"/><text x="400" y="380" font-size="13" fill="#5b6b70" font-weight="400" text-anchor="start">資料</text><rect x="858" y="660" width="334" height="34" rx="8" fill="#fff" stroke="#9aa9ad"/><text x="872" y="682" font-size="13.5" fill="#1f2a2e" font-weight="400" text-anchor="start">測試：node:test ＋ Playwright 真瀏覽器</text></svg>