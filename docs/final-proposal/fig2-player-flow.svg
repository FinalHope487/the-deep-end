<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="740" viewBox="0 0 1190 740" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a2e"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#e7ebec"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c9d1d3" stroke-width="3"/></pattern><pattern id="ovl" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#b45309" stroke-width="2"/></pattern></defs><rect width="1190" height="740" fill="#ffffff"/><text x="40" y="50" font-size="26" fill="#1f2a2e" font-weight="700" text-anchor="start">圖 2　玩家流程（主線約 30 分鐘）</text><text x="40" y="80" font-size="15" fill="#5b6b70" font-weight="400" text-anchor="start">依序找到 4 個地標區域，出口才會出現；前段放鬆、越後面越安靜壓抑。</text><rect x="40" y="110" width="230" height="120" rx="10" fill="#f5f7f7" stroke="#1f2a2e" stroke-width="2"/><text x="54" y="137" font-size="17" fill="#1f2a2e" font-weight="700" text-anchor="start">標題畫面</text><text x="54" y="162" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">開始／繼續</text><text x="54" y="183" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">跳轉關卡、設定</text><line x1="270" y1="170" x2="318" y2="170" stroke="#1f2a2e" stroke-width="2" marker-end="url(#ar)"/><rect x="320" y="110" width="230" height="120" rx="10" fill="#f5f7f7" stroke="#1f2a2e" stroke-width="2"/><text x="334" y="137" font-size="17" fill="#1f2a2e" font-weight="700" text-anchor="start">在泳池建築中醒來</text><text x="334" y="162" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">循遠處的光、聲音</text><text x="334" y="183" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">與門邊指示牌前進</text><line x1="550" y1="170" x2="598" y2="170" stroke="#1f2a2e" stroke-width="2" marker-end="url(#ar)"/><rect x="600" y="110" width="250" height="120" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="2"/><text x="614" y="137" font-size="17" fill="#1f2a2e" font-weight="700" text-anchor="start">① 淺水大廳</text><text x="614" y="162" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">1F・明亮、放鬆</text><text x="614" y="183" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">到達＋15% 探索度</text><rect x="900" y="110" width="250" height="120" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="2"/><text x="914" y="137" font-size="17" fill="#1f2a2e" font-weight="700" text-anchor="start">② 階梯高低池</text><text x="914" y="162" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">1F・高低起伏</text><text x="914" y="183" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">到達＋15% 探索度</text><rect x="900" y="290" width="250" height="120" rx="10" fill="#e6ecf7" stroke="#2563eb" stroke-width="2"/><text x="914" y="317" font-size="17" fill="#1f2a2e" font-weight="700" text-anchor="start">③ 狹窄管道走廊</text><text x="914" y="342" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">2F・低矮、變暗</text><text x="914" y="363" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">到達＋15% 探索度</text><rect x="600" y="290" width="250" height="120" rx="10" fill="#e3e6ea" stroke="#2563eb" stroke-width="2"/><text x="614" y="317" font-size="17" fill="#1f2a2e" font-weight="700" text-anchor="start">④ 深水黑池</text><text x="614" y="342" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">B1・冷暗、壓抑</text><text x="614" y="363" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">到達＋15% 探索度</text><line x1="850" y1="170" x2="898" y2="170" stroke="#1f2a2e" stroke-width="2" marker-end="url(#ar)"/><line x1="1025" y1="230" x2="1025" y2="288" stroke="#1f2a2e" stroke-width="2" marker-end="url(#ar)"/><line x1="900" y1="350" x2="852" y2="350" stroke="#1f2a2e" stroke-width="2" marker-end="url(#ar)"/><path d="M725,410 L725,475 L560,475" fill="none" stroke="#1f2a2e" stroke-width="2" marker-end="url(#ar)"/><rect x="320" y="420" width="238" height="110" rx="10" fill="#fdf1f1" stroke="#dc2626" stroke-width="2"/><text x="334" y="447" font-size="17" fill="#1f2a2e" font-weight="700" text-anchor="start">出口出現（2F）</text><text x="334" y="472" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">去過 4 區後才出現</text><line x1="320" y1="475" x2="272" y2="475" stroke="#1f2a2e" stroke-width="2" marker-end="url(#ar)"/><rect x="40" y="420" width="230" height="110" rx="10" fill="#f5f7f7" stroke="#1f2a2e" stroke-width="2"/><text x="54" y="447" font-size="17" fill="#1f2a2e" font-weight="700" text-anchor="start">結算</text><text x="54" y="472" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">探索度、距離、時間</text><rect x="40" y="565" width="1110" height="150" rx="12" fill="#fafbfb" stroke="#9aa9ad"/><text x="60" y="595" font-size="17" fill="#1f2a2e" font-weight="700" text-anchor="start">全程隨時發生</text><text x="60" y="625" font-size="14.5" fill="#5b6b70" font-weight="400" text-anchor="start">• 每區 3 個「小發現」（小黃鴨、泳鏡…）：靠近發亮，點擊拾取；探索度 = 區域 60% ＋ 小發現 40%</text><text x="60" y="648" font-size="14.5" fill="#5b6b70" font-weight="400" text-anchor="start">• 壓抑度隨進度與時間上升：霧變近、燈變冷、天花板變低；第 3 區後遠處出現黑色人影（不追人、不跳嚇）</text><text x="60" y="671" font-size="14.5" fill="#5b6b70" font-weight="400" text-anchor="start">• 暫停選單：探索度、距離、時間、畫質；重新整理後可「繼續」回到原位置</text><text x="60" y="694" font-size="14.5" fill="#5b6b70" font-weight="400" text-anchor="start">• 涉水變慢、深水時鏡頭被水滴濺濕；目標在別層時，引導改指向樓梯</text></svg>