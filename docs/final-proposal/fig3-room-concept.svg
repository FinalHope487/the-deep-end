<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a2e"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#e7ebec"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c9d1d3" stroke-width="3"/></pattern><pattern id="ovl" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#b45309" stroke-width="2"/></pattern></defs><rect width="1400" height="780" fill="#ffffff"/><text x="40" y="50" font-size="26" fill="#1f2a2e" font-weight="700" text-anchor="start">圖 3　房間生成概念（俯視，手繪示意，不是生成器輸出）</text><text x="40" y="80" font-size="15" fill="#5b6b70" font-weight="400" text-anchor="start">空間先是實心的牆體，再挖出不規則的房間與走道；虛線格只是資料儲存單位，從來不是房間。</text><text x="40" y="102" font-size="15" fill="#5b6b70" font-weight="400" text-anchor="start">範圍約 104 × 62 m；實際世界往四周無限延伸。</text><rect x="40" y="120" width="1040" height="620" fill="url(#hatch)" stroke="none" stroke-width="0" /><line x1="360" y1="120" x2="360" y2="740" stroke="#5b6b70" stroke-width="1.2" stroke-dasharray="3 6"/><line x1="680" y1="120" x2="680" y2="740" stroke="#5b6b70" stroke-width="1.2" stroke-dasharray="3 6"/><line x1="1000" y1="120" x2="1000" y2="740" stroke="#5b6b70" stroke-width="1.2" stroke-dasharray="3 6"/><line x1="40" y1="440" x2="1080" y2="440" stroke="#5b6b70" stroke-width="1.2" stroke-dasharray="3 6"/><rect x="810" y="470" width="130" height="130" fill="#ffffff" stroke="#5b6b70" stroke-width="1.5" stroke-dasharray="2 4"/><text x="820" y="520" font-size="13" fill="#5b6b70" font-weight="700" text-anchor="start">空地／挑空</text><text x="820" y="544.0" font-size="11.5" fill="#5b6b70" font-weight="400" text-anchor="start">走道旁不一定是房間</text><polygon points="80,180 480,180 480,280 380,280 380,420 80,420" fill="#ffffff" stroke="#1f2a2e" stroke-width="3"/><polygon points="300,380 460,380 460,460 540,460 540,640 300,640" fill="#ffffff" stroke="#1f2a2e" stroke-width="3"/><polygon points="620,160 820,160 820,230 940,230 940,340 740,340 740,240 620,240" fill="#ffffff" stroke="#1f2a2e" stroke-width="3"/><polygon points="600,520 680,520 680,560 650,560 650,600 600,600" fill="#ffffff" stroke="#1f2a2e" stroke-width="3"/><polygon points="100,500 240,500 240,580 200,580 200,680 140,680 140,580 100,580" fill="#ffffff" stroke="#1f2a2e" stroke-width="3"/><rect x="300" y="380" width="80" height="40" fill="url(#ovl)" stroke="#b45309" stroke-width="2" /><text x="303.0" y="372.0" font-size="12.5" fill="#b45309" font-weight="700" text-anchor="start">同層重疊</text><rect x="480" y="205.0" width="140" height="30" fill="#dbe7fd" stroke="#2563eb" stroke-width="2" /><rect x="770" y="340" width="30" height="210" fill="#dbe7fd" stroke="#2563eb" stroke-width="2" /><rect x="680" y="525.0" width="120" height="30" fill="#dbe7fd" stroke="#2563eb" stroke-width="2" /><rect x="540" y="530" width="60" height="30" fill="#dbe7fd" stroke="#2563eb" stroke-width="2" /><rect x="240" y="525.0" width="60" height="30" fill="#dbe7fd" stroke="#2563eb" stroke-width="2" /><rect x="800" y="400" width="280" height="30" fill="#dbe7fd" stroke="#2563eb" stroke-width="2" /><polygon points="1080,385.0 1102,415.0 1080,445.0" fill="#2563eb"/><text x="820" y="390" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">走道繼續延伸 →</text><rect x="970" y="300" width="30" height="400" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 5"/><text x="810" y="655.0" font-size="13" fill="#dc2626" font-weight="700" text-anchor="start">天橋（獨立結構）→</text><text x="810" y="678.0" font-size="11.5" fill="#dc2626" font-weight="400" text-anchor="start">跨過走道，不屬於任何房間</text><ellipse cx="220" cy="310" rx="90" ry="50" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="220" y="315.0" font-size="13" fill="#0f766e" font-weight="700" text-anchor="middle">擴充點：水體</text><path d="M850,255.0 C950,260 950,290 890,295.0 S840,325.0 925.0,325.0" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="746.0" y="296.0" font-size="13" fill="#0f766e" font-weight="700" text-anchor="start">擴充點：滑梯</text><text x="95.0" y="214.0" font-size="14" fill="#1f2a2e" font-weight="700" text-anchor="start">大型連通大廳　約 40 m　天花板 9 m</text><text x="320" y="615.0" font-size="14" fill="#1f2a2e" font-weight="700" text-anchor="start">L 形房　天花板 5 m</text><text x="634.0" y="204.0" font-size="14" fill="#1f2a2e" font-weight="700" text-anchor="start">Z 形房　天花板 6 m</text><text x="606.0" y="546.0" font-size="13" fill="#1f2a2e" font-weight="700" text-anchor="start">小房 8 m</text><text x="606.0" y="586.0" font-size="12" fill="#5b6b70" font-weight="400" text-anchor="start">高 3 m</text><text x="106.0" y="534.0" font-size="13.5" fill="#1f2a2e" font-weight="700" text-anchor="start">T 形房</text><text x="106.0" y="556.0" font-size="12" fill="#5b6b70" font-weight="400" text-anchor="start">高 4 m</text><text x="490" y="196.0" font-size="12" fill="#5b6b70" font-weight="600" text-anchor="start">走道旁：牆</text><text x="690" y="516.0" font-size="12" fill="#5b6b70" font-weight="600" text-anchor="start">走道旁：房間</text><text x="370" y="144.0" font-size="12" fill="#5b6b70" font-weight="600" text-anchor="start">虛線＝儲存格邊界，不是房間</text><rect x="1130" y="130" width="34" height="24" fill="url(#hatch)" stroke="#1f2a2e" stroke-width="2" stroke-dasharray=""/><text x="1176" y="148" font-size="14.5" fill="#1f2a2e" font-weight="400" text-anchor="start">實心牆體（填充牆 ≥ 2 m）</text><rect x="1130" y="170" width="34" height="24" fill="#ffffff" stroke="#1f2a2e" stroke-width="2" stroke-dasharray=""/><text x="1176" y="188" font-size="14.5" fill="#1f2a2e" font-weight="400" text-anchor="start">房間：不規則直角形</text><rect x="1130" y="210" width="34" height="24" fill="#dbe7fd" stroke="#2563eb" stroke-width="2" stroke-dasharray=""/><text x="1176" y="228" font-size="14.5" fill="#1f2a2e" font-weight="400" text-anchor="start">走道：連接多個房間</text><rect x="1130" y="250" width="34" height="24" fill="url(#ovl)" stroke="#b45309" stroke-width="2" stroke-dasharray=""/><text x="1176" y="268" font-size="14.5" fill="#1f2a2e" font-weight="400" text-anchor="start">同層房間重疊</text><rect x="1130" y="290" width="34" height="24" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 5"/><text x="1176" y="308" font-size="14.5" fill="#1f2a2e" font-weight="400" text-anchor="start">橋、地道：獨立結構</text><rect x="1130" y="330" width="34" height="24" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="7 5"/><text x="1176" y="348" font-size="14.5" fill="#1f2a2e" font-weight="400" text-anchor="start">擴充點：之後再加</text><text x="1130" y="400" font-size="16" fill="#1f2a2e" font-weight="700" text-anchor="start">規則</text><text x="1130" y="424" font-size="14.5" fill="#5b6b70" font-weight="400" text-anchor="start">• 房間不是正方形單格</text><text x="1130" y="448" font-size="14.5" fill="#5b6b70" font-weight="400" text-anchor="start">• 尺度：10 m 內小房，</text><text x="1130" y="472" font-size="14.5" fill="#5b6b70" font-weight="400" text-anchor="start">  到數十公尺的連通大廳</text><text x="1130" y="496" font-size="14.5" fill="#5b6b70" font-weight="400" text-anchor="start">• 不同房間可有不同高度</text><text x="1130" y="520" font-size="14.5" fill="#5b6b70" font-weight="400" text-anchor="start">• 換種子，整個格局都變</text><text x="1130" y="544" font-size="14.5" fill="#5b6b70" font-weight="400" text-anchor="start">• 走道旁可能是房間、牆</text><text x="1130" y="568" font-size="14.5" fill="#5b6b70" font-weight="400" text-anchor="start">  或空地，不一定填滿</text></svg>